name: Build Android APK (AI Care Vision)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Generate Android Gradle Wrapper & Configure Firebase
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_backup.xml
          flutter create --platforms=android --org com.bdu --project-name fall_detection_app .
          cp /tmp/AndroidManifest_backup.xml android/app/src/main/AndroidManifest.xml
          python3 - << 'EOF'
          from pathlib import Path
          import re

          app_gradle = Path("android/app/build.gradle")
          if app_gradle.exists():
              txt = app_gradle.read_text()
              txt = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", txt)
              txt = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", txt)
              if Path("android/app/google-services.json").exists() and "com.google.gms.google-services" not in txt:
                  txt = txt.replace('id "dev.flutter.flutter-gradle-plugin"', 'id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"')
              app_gradle.write_text(txt)

          settings_gradle = Path("android/settings.gradle")
          if settings_gradle.exists() and Path("android/app/google-services.json").exists():
              stxt = settings_gradle.read_text()
              if "com.google.gms.google-services" not in stxt:
                  stxt = stxt.replace(
                      'id "dev.flutter.flutter-gradle-plugin"',
                      'id "com.google.gms.google-services" version "4.4.2" apply false\n    id "dev.flutter.flutter-gradle-plugin"'
                  )
              settings_gradle.write_text(stxt)
          EOF

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Care-Vision-APK
          path: build/app/outputs/flutter-apk/app-release.apk
