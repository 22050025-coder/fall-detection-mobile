name: Build Android APK (AI Care Vision)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Generate Android Gradle Wrapper & Configure Firebase
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_backup.xml
          flutter create --platforms=android --org com.bdu --project-name fall_detection_app .
          cp /tmp/AndroidManifest_backup.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true
          if [ -f "android/app/google-services.json" ]; then
            echo "Found google-services.json - enabling Google Services plugin"
            sed -i 's/id "dev.flutter.flutter-gradle-plugin"/id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"/g' android/app/build.gradle || true
            sed -i 's/id "dev.flutter.flutter-gradle-plugin" version/id "com.google.gms.google-services" version "4.4.2" apply false\n    id "dev.flutter.flutter-gradle-plugin" version/g' android/settings.gradle || true
          fi

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Care-Vision-APK
          path: build/app/outputs/flutter-apk/app-release.apk
