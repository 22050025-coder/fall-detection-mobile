name: Build Android APK (AI Care Vision)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Generate Clean Android Project & Configure Firebase
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_backup.xml
          cp android/app/google-services.json /tmp/google-services_backup.json
          rm -rf android
          flutter create --platforms=android --org com.bdu --project-name fall_detection_app .
          cp /tmp/AndroidManifest_backup.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/google-services_backup.json android/app/google-services.json
          python3 - << 'EOF'
          from pathlib import Path
          import re

          # 1. Configure android/settings.gradle (add com.google.gms.google-services)
          for s_name in ["android/settings.gradle", "android/settings.gradle.kts"]:
              sp = Path(s_name)
              if sp.exists():
                  stxt = sp.read_text()
                  if "com.google.gms.google-services" not in stxt:
                      if s_name.endswith(".kts"):
                          stxt = stxt.replace(
                              'id("dev.flutter.flutter-plugin-loader")',
                              'id("com.google.gms.google-services") version "4.4.2" apply false\n    id("dev.flutter.flutter-plugin-loader")'
                          )
                      else:
                          stxt = stxt.replace(
                              'id "dev.flutter.flutter-plugin-loader"',
                              'id "com.google.gms.google-services" version "4.4.2" apply false\n    id "dev.flutter.flutter-plugin-loader"'
                          )
                  sp.write_text(stxt)
                  print(f"=== Updated {s_name} ===")
                  print(sp.read_text())

          # 2. Configure android/app/build.gradle (minSdk = 23, compileSdk = 34, google-services plugin)
          for a_name in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              ap = Path(a_name)
              if ap.exists():
                  txt = ap.read_text()
                  txt = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", txt)
                  txt = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", txt)
                  txt = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 34", txt)
                  if "com.google.gms.google-services" not in txt:
                      if a_name.endswith(".kts"):
                          txt = txt.replace(
                              'id("dev.flutter.flutter-gradle-plugin")',
                              'id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")'
                          )
                      else:
                          txt = txt.replace(
                              'id "dev.flutter.flutter-gradle-plugin"',
                              'id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"'
                          )
                  ap.write_text(txt)
                  print(f"=== Updated {a_name} ===")
                  print(ap.read_text())
          EOF

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Care-Vision-APK
          path: build/app/outputs/flutter-apk/app-release.apk
