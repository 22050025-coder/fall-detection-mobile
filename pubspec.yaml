name: fall_detection_app
description: Ứng dụng di động Flutter nhận cảnh báo té ngã thời gian thực qua Firebase & FCM, gửi SMS/Gọi khẩn cấp (ĐATN Huỳnh Minh Chiến - 22050025).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
